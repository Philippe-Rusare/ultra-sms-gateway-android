<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ultra SMS Gateway">
  <defs>
    <linearGradient id="usg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B8BFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#usg-bg)"/>
  <!-- Message bubble -->
  <path d="M12 26a9 9 0 0 1 9-9h17a9 9 0 0 1 9 9v8a9 9 0 0 1-9 9H25l-8.5 7.2a1 1 0 0 1-1.6-.8V41.6A9 9 0 0 1 12 34z" fill="#fff"/>
  <!-- "U" for Ultra, inside the message -->
  <path d="M23 22.5v7.5a6.5 6.5 0 0 0 13 0v-7.5" fill="none" stroke="#1D4ED8" stroke-width="4.4" stroke-linecap="round"/>
  <!-- Radio waves: the SIM card sending it -->
  <path d="M47.5 11.5a8 8 0 0 1 5 5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M48.5 4.8a14 14 0 0 1 10.7 10.7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
</svg>
